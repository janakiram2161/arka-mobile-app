name: Site check (arkaschmuck.de vs. app)

# Run by pushing any commit to the branch "site-check" (or from the Actions tab).
# The report is pushed to the branch "ci-site-check".
on:
  push:
    branches: [site-check]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests playwright && python -m playwright install --with-deps chromium

      - name: Check the shop
        run: python tool/site_check.py 2>&1 | tee site-check.log
        continue-on-error: true

      - name: Save report
        if: always()
        run: |
          mkdir -p site-check && cp site-check.log site-check/ || true
          cd site-check && git init -q && git add . && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Site check ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-site-check
